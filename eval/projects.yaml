# qnx-portcheck evaluation corpus
# Generated 2026-11-15 KST from public GitHub data (read-only gh api calls as tmdry4530).
# For each project:
#   upstream_base_sha = merge_base_commit of GitHub compare  <upstream>:<base_ref>...qnx-ports:<qnx_branch>
#   qnx_head_sha      = head of qnx-ports/<repo> branch <qnx_branch> (gh api repos/qnx-ports/<repo>/branches/<branch>)
#   ground truth      = git diff upstream_base_sha..qnx_head_sha (both fetched --depth=1 by run_eval.py)
#   compare_status/ahead_by/behind_by/compare_files = values returned by the compare API on 2026-11-15 (for self-check).
# verified: true means both SHAs were returned by the GitHub API on 2026-11-15 and the ahead commits were
# inspected manually as QNX port commits (no upstream release commits mixed in).
