# Copy this file to .github/workflows/. Uploading SARIF needs security-events: write.
# Fork pull requests do not receive write tokens, so upload may be skipped or fail;
# set upload: "false" and use actions/upload-artifact there if needed.
# tmdry4530/qnx-portcheck is the public repo; pinning to a commit SHA is recommended.
name: qnx-portcheck
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: tmdry4530/qnx-portcheck/action@main
        with:
          path: "."
